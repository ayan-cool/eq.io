<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Variable Equation Solver</title>
    <link rel="shortcut icon" href="icon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Two Variable Equation Solver</h1><br>
    <span class="eq1">Equation 1 - ax + by + c = 0</span><br><br>
    <span class="eq2">Equation 2 - Ax + By + c = 0</span><br><br>
    <label>Value of a : <input type="number" name="" id = "a"></label><br><br>
    <label>Value of b : <input type="number" name="" id = "b"></label><br><br>
    <label>Value of c : <input type="number" name="" id = "c"></label><br><br>
    <label>Value of A : <input type="number" name="" id = "A"></label><br><br>
    <label>Value of B : <input type="number" name="" id = "B"></label><br><br>
    <label>Value of C : <input type="number" name="" id = "C"></label><br><br>
    <u>SOLUTIONS</u><br>
    <span id="valx"></span><br><br>
    <span id="valy"></span><br><br>

    <button onclick="solve()">Solve</button>

    <script src="script.js"></script>
</body>
</html>
